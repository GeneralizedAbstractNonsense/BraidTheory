
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B4, Braids group</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1c23 0%, #0d0e12 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .header {
      pointer-events: auto;
      background: rgba(20, 22, 30, 0.75);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #e2e8f0;
    }

    .braid-word {
      font-size: 1.4rem;
      font-weight: bold;
      color: #60a5fa;
      margin-top: 4px;
      font-family: 'Courier New', Courier, monospace;
    }

    .btn-reset {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .btn-reset:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    .controls-panel {
      pointer-events: auto;
      background: rgba(20, 22, 30, 0.75);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-self: center;
      margin-bottom: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 100%;
    }

    .controls-title {
      font-size: 0.85rem;
      text-align: center;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .button-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .generator-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 55px;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
      touch-action: manipulation;
    }

    .generator-btn:active {
      transform: scale(0.95);
    }

    .generator-btn.inv {
      background: #8b5cf6;
      box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
    }

    .instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(20, 22, 30, 0.6);
      backdrop-filter: blur(8px);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 600px) {
      .header h1 { font-size: 1rem; }
      .braid-word { font-size: 1.1rem; }
      .generator-btn { padding: 8px 12px; font-size: 0.9rem; min-width: 45px; }
      .instructions { display: none; }
    }
  </style>

  <!-- Three.js e OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <div class="header">
      <div>
        <h1>Braid group B₄</h1>
        <div class="braid-word" id="braidLabel">1 (Identità)</div>
      </div>
      <button class="btn-reset" onclick="resetBraid()">Reset</button>
    </div>

    <div class="instructions">
       <b>Interazione:</b> Tocca/Clicca sulle maniglie a destra oppure usati i pulsanti in basso per intrecciare i fili.
    </div>

    <div class="controls-panel">
      <div class="controls-title">Generatori del gruppo B₄</div>
      <div class="button-group">
        <button class="generator-btn" onclick="addGenerator(1, 1)">σ₁</button>
        <button class="generator-btn inv" onclick="addGenerator(1, -1)">σ₁⁻¹</button>
        <button class="generator-btn" onclick="addGenerator(2, 1)">σ₂</button>
        <button class="generator-btn inv" onclick="addGenerator(2, -1)">σ₂⁻¹</button>
        <button class="generator-btn" onclick="addGenerator(3, 1)">σ₃</button>
        <button class="generator-btn inv" onclick="addGenerator(3, -1)">σ₃⁻¹</button>
      </div>
    </div>
  </div>

  <script>
    // --- COSTANTI E CONFIGURAZIONE ---
    const STRAND_COLORS = [
      0x2ecc71, // Verde (Top - Posizione 3)
      0x3498db, // Blu (Posizione 2)
      0xf1c40f, // Giallo (Posizione 1)
      0xe74c3c  // Rosso (Bottom - Posizione 0)
    ].reverse(); // Indici: 0: Rosso, 1: Giallo, 2: Blu, 3: Verde

    const STRAND_POSITIONS_Y = [-2.25, -0.75, 0.75, 2.25];
    const DISC_X_MIN = -5.0;
    const DISC_X_MAX = 5.0;

    // --- VARIABILI DI STATO ---
    let braidWord = []; // Es. [{index: 1, sign: 1}, {index: 2, sign: -1}]
    let animatedProgress = 1.0; // 0 to 1 per l'animazione di transizione
    let isAnimating = false;
    
    // --- SCENA THREE.JS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a1c23, 0.03);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 13);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 25;
    controls.minDistance = 5;

    // --- ILLUMINAZIONE ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(10, 15, 10);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x60a5fa, 0.4);
    dirLight2.position.set(-10, -10, -10);
    scene.add(dirLight2);

    // --- ELEMENTI 3D STRUTTURALI (DISCHI) ---
    const discGeometry = new THREE.CylinderGeometry(3.2, 3.2, 0.25, 48);
    const discMaterial = new THREE.MeshStandardMaterial({
      color: 0x94a3b8,
      metalness: 0.8,
      roughness: 0.2,
      transparent: true,
      opacity: 0.85
    });

    const leftDisc = new THREE.Mesh(discGeometry, discMaterial);
    leftDisc.rotation.z = Math.PI / 2;
    leftDisc.position.x = DISC_X_MIN;
    scene.add(leftDisc);

    const rightDisc = new THREE.Mesh(discGeometry, discMaterial);
    rightDisc.rotation.z = Math.PI / 2;
    rightDisc.position.x = DISC_X_MAX;
    scene.add(rightDisc);

    // Boccole sui dischi
    STRAND_POSITIONS_Y.forEach(y => {
      const holeGeo = new THREE.TorusGeometry(0.22, 0.05, 16, 32);
      const holeMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.9, roughness: 0.1 });
      
      const hLeft = new THREE.Mesh(holeGeo, holeMat);
      hLeft.rotation.y = Math.PI / 2;
      hLeft.position.set(DISC_X_MIN, y, 0);
      scene.add(hLeft);

      const hRight = new THREE.Mesh(holeGeo, holeMat);
      hRight.rotation.y = Math.PI / 2;
      hRight.position.set(DISC_X_MAX, y, 0);
      scene.add(hRight);
    });

    // --- GESTIONE MESH DEI FILI E MANIGLIE INTERATTIVE ---
    const strandMeshes = [];
    const handleMeshes = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Creazione oggetti filo e maniglie destre
    for (let i = 0; i < 4; i++) {
      // Mesh filo
      const strandMat = new THREE.MeshStandardMaterial({
        color: STRAND_COLORS[i],
        roughness: 0.3,
        metalness: 0.2
      });
      const strandMesh = new THREE.Mesh(new THREE.BufferGeometry(), strandMat);
      scene.add(strandMesh);
      strandMeshes.push(strandMesh);

      // Maniglia sferica ad ogni estremità destra per interazione touch/click
      const handleGeo = new THREE.SphereGeometry(0.3, 32, 32);
      const handleMat = new THREE.MeshStandardMaterial({
        color: STRAND_COLORS[i],
        roughness: 0.1,
        metalness: 0.5,
        emissive: STRAND_COLORS[i],
        emissiveIntensity: 0.2
      });
      const handleMesh = new THREE.Mesh(handleGeo, handleMat);
      handleMesh.userData = { strandIndex: i };
      scene.add(handleMesh);
      handleMeshes.push(handleMesh);
    }

    // --- CALCOLO CURVE ED EVOLUZIONE TRECCIA ---
    function computeStrandCurves(word, tAnim = 1.0) {
      const numSteps = word.length;
      const strandPaths = [[], [], [], []]; // Punti per ogni filo 0..3

      // Posizione verticale corrente di ogni filo (traccia permuta)
      let currentPermutation = [0, 1, 2, 3]; 

      // Numero di campioni lungo l'asse X
      const totalXSegments = Math.max(1, numSteps) * 20;
      const xSpan = DISC_X_MAX - DISC_X_MIN;

      // Inizializza i punti iniziali al disco sinistro
      for (let s = 0; s < 4; s++) {
        strandPaths[s].push(new THREE.Vector3(DISC_X_MIN, STRAND_POSITIONS_Y[s], 0));
      }

      if (numSteps === 0) {
        // Treccia Identità (Linee rette)
        for (let s = 0; s < 4; s++) {
          strandPaths[s].push(new THREE.Vector3(DISC_X_MAX, STRAND_POSITIONS_Y[s], 0));
        }
      } else {
        // Costruisci la geometria passo dopo passo lungo l'asse X
        for (let stepIdx = 0; stepIdx < numSteps; stepIdx++) {
          const gen = word[stepIdx];
          const i = gen.index - 1; // Converti a 0-index (0, 1, 2)
          const sign = gen.sign;

          const xStart = DISC_X_MIN + (stepIdx / numSteps) * xSpan;
          const xEnd = DISC_X_MIN + ((stepIdx + 1) / numSteps) * xSpan;
          const xMid = (xStart + xEnd) / 2;

          // Per l'ultimo passo, applica un'interpolazione graduale per l'animazione
          const isLastStep = (stepIdx === numSteps - 1);
          const factor = isLastStep ? tAnim : 1.0;

          // Trova quali fili occupano attualmente le posizioni i e i+1
          const strandA = currentPermutation[i];     // Filo in posizione i
          const strandB = currentPermutation[i + 1]; // Filo in posizione i+1

          const yA = STRAND_POSITIONS_Y[i];
          const yB = STRAND_POSITIONS_Y[i + 1];

          const zDepth = 0.85 * sign; // Profondità 3D per lo scavalcamento

          const samples = 12;
          for (let s = 1; s <= samples; s++) {
            const frac = s / samples;
            const x = THREE.MathUtils.lerp(xStart, xEnd, frac);

            // Per tutti i fili non coinvolti nello scambio:
            for (let pos = 0; pos < 4; pos++) {
              if (pos !== i && pos !== i + 1) {
                const st = currentPermutation[pos];
                const y = STRAND_POSITIONS_Y[pos];
                strandPaths[st].push(new THREE.Vector3(x, y, 0));
              }
            }

            // Filo A (va da pos i a pos i+1)
            const yCurrentA = THREE.MathUtils.lerp(yA, THREE.MathUtils.lerp(yA, yB, factor), frac);
            const zCurrentA = Math.sin(frac * Math.PI) * zDepth * factor;
            strandPaths[strandA].push(new THREE.Vector3(x, yCurrentA, zCurrentA));

            // Filo B (va da pos i+1 a pos i)
            const yCurrentB = THREE.MathUtils.lerp(yB, THREE.MathUtils.lerp(yB, yA, factor), frac);
            const zCurrentB = -Math.sin(frac * Math.PI) * zDepth * factor;
            strandPaths[strandB].push(new THREE.Vector3(x, yCurrentB, zCurrentB));
          }

          // Aggiorna la permutazione a fine dello step completo
          if (!isLastStep || tAnim >= 0.99) {
            currentPermutation[i] = strandB;
            currentPermutation[i + 1] = strandA;
          }
        }
      }

      return { strandPaths, currentPermutation };
    }

    // --- AGGIORNAMENTO GEOMETRIA TRECCIA ---
    function updateBraidGeometries() {
      const { strandPaths, currentPermutation } = computeStrandCurves(braidWord, animatedProgress);

      for (let s = 0; s < 4; s++) {
        const points = strandPaths[s];
        const curve = new THREE.CatmullRomCurve3(points);
        
        // Rigenera la geometria del tubo
        if (strandMeshes[s].geometry) strandMeshes[s].geometry.dispose();
        strandMeshes[s].geometry = new THREE.TubeGeometry(curve, points.length * 2, 0.12, 16, false);

        // Posiziona le maniglie destre alla fine dei fili
        const lastPoint = points[points.length - 1];
        handleMeshes[s].position.copy(lastPoint);
        handleMeshes[s].position.x = DISC_X_MAX + 0.25; // Sposta leggermente oltre il disco
      }
    }

    // --- GESTIONE INTERAZIONI (TOUCH / MOUSE) ---
    let selectedHandleIndex = null;

    function onPointerDown(event) {
      if (isAnimating) return;

      const clientX = event.touches ? event.touches[0].clientX : event.clientX;
      const clientY = event.touches ? event.touches[0].clientY : event.clientY;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(handleMeshes);

      if (intersects.length > 0) {
        selectedHandleIndex = intersects[0].object.userData.strandIndex;
        controls.enabled = false; // Disabilita rotazione camera durante il tocco maniglia
      }
    }

    function onPointerUp(event) {
      if (selectedHandleIndex !== null) {
        // Cliccando su una maniglia adiacente, genera l'intreccio automatico
        const currentPos = getCurrentPositionOfStrand(selectedHandleIndex);
        if (currentPos < 3) {
          addGenerator(currentPos + 1, 1);
        } else {
          addGenerator(3, -1);
        }
        selectedHandleIndex = null;
      }
      controls.enabled = true;
    }

    function getCurrentPositionOfStrand(strandIdx) {
      const { currentPermutation } = computeStrandCurves(braidWord, 1.0);
      return currentPermutation.indexOf(strandIdx);
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    // --- AZIONI ED ANIMAZIONI ---
    function addGenerator(index, sign) {
      if (isAnimating) return;

      braidWord.push({ index, sign });
      updateBraidLabel();

      // Avvia animazione di inserimento
      isAnimating = true;
      animatedProgress = 0.0;
    }

    function resetBraid() {
      braidWord = [];
      animatedProgress = 1.0;
      isAnimating = false;
      updateBraidLabel();
      updateBraidGeometries();
    }

    function updateBraidLabel() {
      const labelEl = document.getElementById('braidLabel');
      if (braidWord.length === 0) {
        labelEl.innerText = "1 (Identità)";
        return;
      }

      const formattedStr = braidWord.map(g => {
        const inv = g.sign === -1 ? '⁻¹' : '';
        return `σ${g.index}${inv}`;
      }).join(' ');

      labelEl.innerText = formattedStr;
    }

    // --- LOOP DI RENDERING ED ANIMAZIONE ---
    let lastTime = performance.now();

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const deltaTime = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      if (isAnimating) {
        animatedProgress += deltaTime * 2.5; // Velocità animazione
        if (animatedProgress >= 1.0) {
          animatedProgress = 1.0;
          isAnimating = false;
        }
        updateBraidGeometries();
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Inizializzazione
    updateBraidGeometries();
    animate(performance.now());

    // Responsive Canvas Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
  </html>
